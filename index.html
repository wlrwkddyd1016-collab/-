<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPMorgan Chase & Co. 스타일 웹사이트</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f7f9fa;
      color: #111;
    }

    header {
      background-color: #0a1e36;
      color: #ffffff;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 24px;
      font-size: 15px;
    }

    nav a:hover {
      color: #ffffff;
    }

    .hero {
      background: linear-gradient(135deg, #0a1e36 0%, #16365c 100%);
      color: #ffffff;
      padding: 100px 40px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .hero p {
      font-size: 18px;
      color: #d1d5db;
      max-width: 650px;
      margin: 0 auto 30px auto;
      line-height: 1.6;
    }

    .btn-main {
      display: inline-block;
      background-color: #ffffff;
      color: #0a1e36;
      padding: 14px 32px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 4px;
    }

    .cards-container {
      max-width: 1100px;
      margin: -40px auto 60px auto;
      padding: 0 20px;
      display: flex;
      gap: 20px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 30px;
      flex: 1;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #0a1e36;
    }

    .card p {
      color: #555;
      line-height: 1.5;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">JPMORGAN CHASE & CO.</div>
    <nav>
      <a href="#about">About Us</a>
      <a href="#business">Our Businesses</a>
      <a href="#news">News</a>
    </nav>
  </header>

  <section class="hero">
    <h1>글로벌 금융을 선도하는 혁신</h1>
    <p>우리는 지속 가능한 성장과 혁신적인 금융 솔루션을 통해 고객과 지역 사회의 더 나은 미래를 만듭니다.</p>
    <a href="#explore" class="btn-main">자세히 알아보기</a>
  </section>

  <section class="cards-container">
    <div class="card">
      <h3>자산 관리</h3>
      <p>개인 및 기관 고객을 위한 맞춤형 글로벌 투자 포트폴리오를 제공합니다.</p>
    </div>
    <div class="card">
      <h3>기업 금융</h3>
      <p>글로벌 비즈니스의 성장과 확장을 지원하는 최적의 자본 솔루션입니다.</p>
    </div>
    <div class="card">
      <h3>지속 가능성</h3>
      <p>환경과 사회에 긍정적인 영향을 미치는 지속 가능한 투자 전략을 실천합니다.</p>
    </div>
  </section>

</body>
</html>
